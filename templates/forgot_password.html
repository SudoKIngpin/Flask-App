{% extends "base.html" %}
{% block title %}Forgot Password - SIET Exams{% endblock %}
{% block content %}
<div class="auth-wrap">
  <h1>Forgot your password?</h1>
  <p class="sub">Enter the email you registered with — we'll send a reset link.</p>
  <form method="POST">
    <label for="email">Email</label>
    <input type="email" name="email" id="email" required autofocus>
    <button class="btn btn-block" style="margin-top:22px" type="submit">Send Reset Link</button>
  </form>
  <p class="auth-switch"><a href="{{ url_for('login') }}">&larr; Back to login</a></p>
</div>
{% endblock %}
