{% extends "base.html" %}
{% block title %}Admin Login - SIET Exams{% endblock %}
{% block content %}
<div class="auth-wrap">
  <h1>Admin Login</h1>
  <form method="POST">
    <label for="password">Password</label>
    <input type="password" name="password" id="password" required autofocus>
    <button class="btn btn-block" style="margin-top:22px" type="submit">Login</button>
  </form>
</div>
{% endblock %}
