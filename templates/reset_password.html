{% extends "base.html" %}
{% block title %}Reset Password - SIET Exams{% endblock %}
{% block content %}
<div class="auth-wrap">
  <h1>Set a new password</h1>
  <form method="POST">
    <label for="password">New Password</label>
    <input type="password" name="password" id="password" minlength="6" required autofocus>

    <label for="confirm_password">Confirm New Password</label>
    <input type="password" name="confirm_password" id="confirm_password" minlength="6" required>

    <button class="btn btn-block" style="margin-top:22px" type="submit">Update Password</button>
  </form>
</div>
{% endblock %}
